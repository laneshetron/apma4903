[project]
name = "kalshi-data"
version = "0.1.0"
description = "Offline tooling for Kalshi market-data logs: Parquet conversion, order-book replay, validation"
requires-python = ">=3.13"
dependencies = [
    "kalshi-python-async>=3.29",
    "polars>=1.0",
    "orjson>=3.10",
    "duckdb>=1.0",
    "numpy>=2.5.3",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kalshi_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
